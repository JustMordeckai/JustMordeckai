name: Profile summary cards

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pushes with the default GITHUB_TOKEN; the read-only PAT is only used for the API.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # Fail early with an explicit error when the PAT is missing, expired or revoked,
      # and warn two weeks before it expires.
      - name: Check METRICS_TOKEN
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if ! headers=$(curl -fsS -o /dev/null -D - -H "Authorization: Bearer $TOKEN" https://api.github.com/user); then
            echo '::error title=METRICS_TOKEN invalid::Secret METRICS_TOKEN is missing, expired or revoked. Create a fine-grained PAT (all repositories, Contents and Metadata read-only) and update the secret.'
            exit 1
          fi
          expiry=$(printf '%s' "$headers" | tr -d '\r' | sed -n 's/^github-authentication-token-expiration: //Ip')
          if [ -n "$expiry" ]; then
            days=$(( ($(date -d "$expiry" +%s) - $(date +%s)) / 86400 ))
            echo "METRICS_TOKEN expires on $expiry ($days days left)"
            if [ "$days" -lt 14 ]; then
              echo "::warning title=METRICS_TOKEN expires soon::Secret METRICS_TOKEN expires in $days days ($expiry)."
            fi
          fi

      # Only the profile-details card (calendar) is used: the other cards only see public repos.
      # The action wipes its output folder on every run, so each theme is generated on its own
      # and the light card is set aside before the dark one.
      - name: Profile details card (light)
        uses: vn7n24fzkq/github-profile-summary-cards@d9632798b299e9ad6940449a859c30742eb5b549 # v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: false
          THEME: github

      - name: Set the light card aside
        run: |
          mkdir -p "$RUNNER_TEMP/cards/github"
          mv profile-summary-card-output/github/0-profile-details.svg "$RUNNER_TEMP/cards/github/"

      - name: Profile details card (dark)
        uses: vn7n24fzkq/github-profile-summary-cards@d9632798b299e9ad6940449a859c30742eb5b549 # v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: false
          THEME: github_dark

      - name: Keep only the profile details cards
        run: |
          mkdir -p "$RUNNER_TEMP/cards/github_dark"
          mv profile-summary-card-output/github_dark/0-profile-details.svg "$RUNNER_TEMP/cards/github_dark/"
          sudo rm -rf profile-summary-card-output
          mv "$RUNNER_TEMP/cards" profile-summary-card-output

      - name: Commit hours and top languages cards
        run: node scripts/stats-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898733+github-actions[bot]@users.noreply.github.com'
          # Also stages the cards that are no longer generated (deletions).
          git add profile-summary-card-output stats
          git diff --cached --quiet || git commit -m 'Update profile stats cards'
          git push
