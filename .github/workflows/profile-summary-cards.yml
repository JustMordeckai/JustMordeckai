name: Profile summary cards

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Push via le GITHUB_TOKEN par défaut ; le PAT (lecture seule) ne sert qu'à l'API.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # Fail early with an explicit error when the PAT is missing, expired or revoked,
      # and warn two weeks before it expires.
      - name: Check METRICS_TOKEN
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if ! headers=$(curl -fsS -o /dev/null -D - -H "Authorization: Bearer $TOKEN" https://api.github.com/user); then
            echo '::error title=METRICS_TOKEN invalid::Secret METRICS_TOKEN is missing, expired or revoked. Create a fine-grained PAT (all repositories, Contents and Metadata read-only) and update the secret.'
            exit 1
          fi
          expiry=$(printf '%s' "$headers" | tr -d '\r' | sed -n 's/^github-authentication-token-expiration: //Ip')
          if [ -n "$expiry" ]; then
            days=$(( ($(date -d "$expiry" +%s) - $(date +%s)) / 86400 ))
            echo "METRICS_TOKEN expires on $expiry ($days days left)"
            if [ "$days" -lt 14 ]; then
              echo "::warning title=METRICS_TOKEN expires soon::Secret METRICS_TOKEN expires in $days days ($expiry)."
            fi
          fi

      # Seule la carte profile-details (calendrier) est utilisée : les autres cartes
      # ne voient que les repos publics.
      - uses: vn7n24fzkq/github-profile-summary-cards@d9632798b299e9ad6940449a859c30742eb5b549 # v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: false

      - name: Commit hours card
        run: node scripts/commit-hours.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898733+github-actions[bot]@users.noreply.github.com'
          git add profile-summary-card-output stats
          git diff --cached --quiet || git commit -m 'Update profile stats cards'
          git push
